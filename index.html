const view=document.getElementById('view');

const HOME='蘅京宮闈_首頁.html';
let current=HOME;
function show(page, mode='push'){
  if(!Object.prototype.hasOwnProperty.call(pages,page))return;
  current=page;
  view.srcdoc=pages[page];
  navBack.hidden=(page===HOME);
  const hash='#'+encodeURIComponent(page);
  try{
    if(mode==='push' && location.hash!==hash)history.pushState({page},'',hash);

  }catch(err){console.warn('History unavailable',err)}

    const doc=view.contentDocument;

      const link=event.target.closest('a[href]');if(!link)return;

      const file=decodeURIComponent(raw.split('#')[0].split('?')[0]);

onAuthStateChanged(auth,u=>{authUser=u;if(u){onSnapshot(collection(db,'ledgerEvents'),snap=>{records=snap.docs.map(d=>d.data());records.sort((a,b)=>String(a.created).localeCompare(String(b.created)));gotEvents=true;notify()},e=>error('讀取流水失敗：'+e.message));onSnapshot(collection(db,'memberCategories'),snap=>{assignments={};snap.docs.forEach(d=>{const x=d.data();if(x.name&&x.category)assignments[x.name]=x.category});gotCategories=true;notify()},e=>error('讀取分類失敗：'+e.message))}});
signInAnonymously(auth).catch(e=>error('匿名登入失敗：'+e.message));
document.getElementById('view').addEventListener('load',()=>{if(ready)notify()});window.addEventListener('message',async e=>{if(e.source!==document.getElementById('view').contentWindow||e.data?.channel!=='hengjing-cloud')return;const d=e.data;if(d.type==='subscribe'){subscribers.add(e.source);if(ready)notify();return}if(!d.id)return;const reply=(ok,result,message)=>e.source.postMessage({channel:'hengjing-cloud',type:'reply',id:d.id,ok,result,message},'*');if(!authUser)return reply(false,null,'尚未完成匿名登入');try{
if(d.type==='submit'){
if(!Array.isArray(d.rows)||!d.rows.length||d.rows.length>30)throw Error('每次最多登記30筆');
for(const r of d.rows){if(typeof r.id!=='string'||!/^[a-f0-9-]{36}-[0-9]{1,2}$/.test(r.id)||typeof r.name!=='string'||!r.name.trim()||r.name.length>100||typeof r.activity!=='string'||!r.activity.trim()||r.activity.length>150||!['points','silver','item'].includes(r.kind)||!Number.isSafeInteger(r.signed)||r.signed===0||Math.abs(r.signed)>10000000||typeof r.date!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(r.date)||typeof r.created!=='string'||typeof r.category!=='string'||r.category.length>100)throw Error('登記內容不符合規則')}
// Each event is immutable; same ID cannot overwrite. Atomic multi-entry batches require server transaction, so report partial failures explicitly.
let saved=0;for(const r of d.rows){const data={...r,uid:authUser.uid};try{await setDoc(doc(db,'ledgerEvents',r.id),data);saved++}catch(err){throw Error('已送出 '+saved+' 筆，剩餘失敗；請先查流水再重試：'+err.message)}}
const r=d.rows[0];if(!assignments[r.name]){try{await setDoc(doc(db,'memberCategories',encodeURIComponent(r.name)),{name:r.name,category:r.category,uid:authUser.uid})}catch(err){error('角色分類尚未同步：'+err.message)}}reply(true,{saved});return}
if(d.type==='assign'){if(typeof d.name!=='string'||!d.name.trim()||d.name.length>100||typeof d.category!=='string'||!d.category.trim()||d.category.length>100)throw Error('分類資料不正確');if(assignments[d.name])throw Error('既有角色分類不可任意變更');await setDoc(doc(db,'memberCategories',encodeURIComponent(d.name)),{name:d.name,category:d.category,uid:authUser.uid});reply(true,{});return}
throw Error('未知操作')
}catch(err){reply(false,null,err.message)}});
</script></body></html>
